# Workflow to deploy a Shiny app to shinyapps.io
name: Deploy-Shiny

# This workflow is triggered on pushes to the main branch
on:
  push:
    branches:
      - main # Or whichever branch you want to deploy from

jobs:
  deploy-to-shinyapps:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3' # Or the version of R you use

      - name: Install rsconnect
        run: install.packages('rsconnect')
        shell: Rscript {0}

      - name: Deploy to shinyapps.io
        run: |
          rsconnect::setAccountInfo(
            name   = "${{ secrets.SHINYAPPS_ACCOUNT }}",
            token  = "${{ secrets.SHINYAPPS_TOKEN }}",
            secret = "${{ secrets.SHINYAPPS_SECRET }}"
          )
          rsconnect::deployApp(
            appName = "GIMP", # <-- CHANGE THIS
            forceUpdate = TRUE
          )
        shell: Rscript {0}
