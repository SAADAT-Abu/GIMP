# Workflow to deploy a Shiny app to shinyapps.io
name: Deploy-Shiny

on:
  push:
    branches:
      - main

jobs:
  deploy-to-shinyapps:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # --- ADD THIS NEW STEP ---
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R package dependencies
        run: install.packages(c('rsconnect', 'curl', 'snowflakeauth'))
        shell: Rscript {0}

      - name: Deploy to shinyapps.io
        run: |
          rsconnect::setAccountInfo(
            name   = "${{ secrets.SHINYAPPS_ACCOUNT }}",
            token  = "${{ secrets.SHINYAPPS_TOKEN }}",
            secret = "${{ secrets.SHINYAPPS_SECRET }}"
          )
          rsconnect::deployApp(appName = "GIMP")
        shell: Rscript {0}
